name: build
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
  multiplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright@1.48.2
      # The runner image already has Chromium's libraries; --with-deps only adds fonts. When the Ubuntu mirrors
      # are unreachable, fall back to the browser alone instead of failing before any test runs.
      - run: npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Server, co-op, versus, split screen and bug sweep checks
        run: npm test
